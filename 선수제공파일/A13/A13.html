<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #login {
            background-color: #bfbfbf;
            display: flex;
            justify-content: center;
            padding: 10px 20px;
            width: 100px;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }

        #login:hover {
            background-color: #a6a6a6;
        }

        #modal {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-window {
            width: 600px;
            padding: 40px;
            position: relative;
            background-color: white;
            border-radius: 20px;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 20px;
            text-decoration: none;
            color: red;
        }

        #modal:not(:target) {
            opacity: 0;
            visibility: hidden;
        }

        .modal-main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

    </style>
</head>

<body>
    <div class="container">
        <a href="#modal" id="login">로그인</a>

        <div id="modal">
            <div class="modal-window">
                <a href="#" class="modal-close">X</a>
                <div class="modal-main">
                    <h3>계정 로그인</h3>
                    <p>안전한 서비스를 위해 로그인이 필요합니다.</p>
                    <p>계속하려면 아래에 등록된 이메일과 비밀번호를 입력해주세요.</p>
                    <p>로그인 계속</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
