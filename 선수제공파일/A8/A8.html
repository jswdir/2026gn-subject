<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f9fa;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .spbag {
            width: 100%;
            max-width: 800px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .spbag>h2 {
            padding: 20px;
            background-color: #333;
            color: white;
            text-align: center;
            font-size: 24px;
        }

        .item-list {
            padding: 0px 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .item-left img {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #f0f0f0;
        }

        .item-detail h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .item-detail p {
            font-size: 13px;
            color: #888;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .item-count {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }

        .item-count button {
            width: 30px;
            height: 30px;
            border: none;
            background-color: white;
            font-size: 16px;
        }

        .item-count span {
            width: 40px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        .price {
            font-weight: bold;
            text-align: right;
        }

        .dlt-btn {
            width: 24px;
            height: 24px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .payment-section {
            padding: 20px;
            background-color: #fafafa;
        }

        .payment-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
            color: #555;
        }

        .payment-line.total {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            font-weight: bold;
        }

        .total-price {
            font-size: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }

        .btn-group button {
            padding: 10px 30px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-continue {
            background-color: gray;
            color: white;
        }

        .btn-order {
            background-color: #00a50e;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spbag">
            <h2>장바구니</h2>

            <div class="item-list">
                <div class="item">
                    <div class="item-left">
                        <img src="./images/tshirt.jpg" alt="T-Shirt">
                        <div class="item-detail">
                            <h4>WorldSkills 공식 티셔츠</h4>
                            <p>색상: 네이비<br>사이즈: L</p>
                        </div>
                    </div>
                    <div class="item-right">
                        <div class="item-count">
                            <button>-</button>
                            <span>2</span>
                            <button>+</button>
                        </div>
                        <span class="price">25,000원</span>
                        <button class="dlt-btn">✖</button>
                    </div>
                </div>

                <div class="item">
                    <div class="item-left">
                        <img src="./images/book.jpg" alt="Book">
                        <div class="item-detail">
                            <h4>기능경기 가이드북</h4>
                            <p>종류: 웹디자인<br>2026년 최신판</p>
                        </div>
                    </div>
                    <div class="item-right">
                        <div class="item-count">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                        <span class="price">15,000원</span>
                        <button class="dlt-btn">✖</button>
                    </div>
                </div>

                <div class="item">
                    <div class="item-left">
                        <img src="./images/laptop-case.jpg" alt="Laptop Case">
                        <div class="item-detail">
                            <h4>WorldSkills 노트북 파우치</h4>
                            <p>색상: 블랙<br>15인치 호환</p>
                        </div>
                    </div>
                    <div class="item-right">
                        <div class="item-count">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                        <span class="price">35,000원</span>
                        <button class="dlt-btn">✖</button>
                    </div>
                </div>
            </div>

            <div class="payment-section">
                <div class="payment-line">
                    <span>상품금액</span>
                    <span>75,000원</span>
                </div>
                <div class="payment-line">
                    <span>배송비</span>
                    <span>3,000원</span>
                </div>
                <div class="payment-line total">
                    <span>총 결제금액</span>
                    <span class="total-price">78,000원</span>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-continue">쇼핑 계속하기</button>
                <button class="btn-order">주문하기</button>
            </div>
        </div>
    </div>
</body>

</html>
