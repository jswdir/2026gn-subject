<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: #fff;
        transition: background-color 0.5s;
    }

    label {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    [type="checkbox"] {
        appearance: none;
        position: relative;
        background-color: #f0f0f0;
        border: 2px solid rgb(167, 167, 167);
        border-radius: 50px;
        width: 300px;
        height: 150px;
        transition: all 0.5s;
    }

    [type="checkbox"]::before {
        content: "";
        position: absolute;
        left: 0;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        transform: scale(0.7);
        background-color: white;
        transition: all 0.5s;
    }

    [type="checkbox"]:checked::before {
        background-color: yellow;
        left: 150px;
    }

    [type="checkbox"]:checked {
        background-color: #0a0a5c;
        border-color: #0a0a5c;
    }

    body:has(label input[type="checkbox"]:checked) {
        background-color: #222;
        color: #fff;
    }
</style>

<body>
    <label>
        <input role="switch" type="checkbox" />
    </label>
</body>

</html>
