<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 800px;
            text-align: center;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 50px;
        }

        ul {
            list-style-type: none;
            width: 600px;
            margin: 0 auto;
            text-align: left;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        li {
            padding: 20px;
        }

        label {
            color: #fff;
            padding: 5px 20px;
            border-radius: 50px;
            margin-right: 10px;
        }

        hr {
            border: 1px solid #eee;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>공지사항</h1>
        <ul>
            <li><label style="background-color: rgb(250, 42, 42);">중요</label> 2026년 WorldSkills 대회 일정 안내</li>
            <hr>
            <li><label style="background-color: rgb(33, 137, 255);">공지</label> 웹디자인 기술대회 참가신청 마감</li>
            <hr>
            <li><label style="background-color: rgb(33, 137, 255);">안내</label> 온라인 교육과정 개설 안내</li>
            <hr>
            <li><label style="background-color: rgb(33, 137, 255);">공지</label> 2026년 1분기 교육일정 발표</li>
            <hr>
            <li><label style="background-color: rgb(33, 137, 255);">안내</label> 홈페이지 점검 일정 안내</li>
        </ul>
    </div>
</body>

</html>
