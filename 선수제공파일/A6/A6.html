<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        footer {
            background-color: #f8f8f8;
            padding: 20px 0;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .intro {
            padding-right: 20px;
        }

        .sub {
            display: flex;
            justify-content: space-between;
            margin-right: 60px;
        }

        .shortcut,
        .help {
            flex: 1;
            padding: 0 20px;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            height: 50px;
        }

        ul {
            list-style: none;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <footer>
        <div class="footer-top">
            <div class="intro">
                <h1>WorldSkills Korea</h1>
                <p>세계기능올림픽대회를 통해 기능인재 양성과<br>
                    기능의 우수성을 널리 알리고 있습니다.</p>
            </div>
            <div class="sub">
                <div class="shortcut">
                    <h4>바로가기</h4>
                    <ul>
                        <li>기능경기대회</li>
                        <li>교육과정</li>
                        <li>자료실</li>
                        <li>공지사항</li>
                    </ul>
                </div>
                <div class="help">
                    <h4>고객지원</h4>
                    <ul>
                        <li>기능경기대회</li>
                        <li>교육과정</li>
                        <li>자료실</li>
                        <li>공지사항</li>
                    </ul>
                </div>
            </div>
        </div>
        <hr>
        <div class="footer-bottom">
            <div class="address">
                <p>주소 : 서울특별시 강남구 테헤란로 123 WorldSkills 빌딩</p>
                <p>전화 : 02-123-4567 | 이메일 : info@worldskillskorea.org</p>
            </div>
            <div class="copyright">
                <p>© 2026 WorldSkills Korea. All rights reserved.</p>
            </div>

</html>
